<!-- EmailJS template #2: "yes"
     Subject in EmailJS:  💖 SHE SAID YES!
     Paste everything below into the template's code editor. -->
<div style="background:#FFF8F1;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;border:1px solid #F1DFE3;overflow:hidden;">

    <!-- Pink header -->
    <tr>
      <td style="background:#E8798F;padding:28px 20px;text-align:center;">
        <div style="font-size:52px;line-height:1;">🥳</div>
        <h1 style="font-size:28px;color:#ffffff;margin:12px 0 0;">💖 SHE SAID YES! 💖</h1>
      </td>
    </tr>

    <!-- The plan -->
    <tr>
      <td style="padding:26px 24px 8px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="border:2px dashed #FFC6A8;border-radius:16px;">
          <tr>
            <td style="padding:14px 18px;font-size:15px;color:#7A5A68;border-bottom:1px solid #F1DFE3;">Plan</td>
            <td style="padding:14px 18px;font-size:16px;color:#4A2C3A;font-weight:bold;text-align:right;border-bottom:1px solid #F1DFE3;">{{date_type}}</td>
          </tr>
          <tr>
            <td style="padding:14px 18px;font-size:15px;color:#7A5A68;border-bottom:1px solid #F1DFE3;">📅 Day</td>
            <td style="padding:14px 18px;font-size:16px;color:#4A2C3A;font-weight:bold;text-align:right;border-bottom:1px solid #F1DFE3;">{{date_day}}</td>
          </tr>
          <tr>
            <td style="padding:14px 18px;font-size:15px;color:#7A5A68;border-bottom:1px solid #F1DFE3;">🕑 Time</td>
            <td style="padding:14px 18px;font-size:16px;color:#4A2C3A;font-weight:bold;text-align:right;border-bottom:1px solid #F1DFE3;">{{date_time}}</td>
          </tr>
          <tr>
            <td style="padding:14px 18px;font-size:15px;color:#7A5A68;">💬 Her note</td>
            <td style="padding:14px 18px;font-size:16px;color:#4A2C3A;font-weight:bold;text-align:right;">{{her_note}}</td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Fun fact + footer -->
    <tr>
      <td style="padding:16px 24px 30px;text-align:center;">
        <p style="font-size:15px;color:#4A2C3A;margin:0 0 14px;">{{no_count}}</p>
        <p style="font-size:14px;color:#A8C3A0;font-weight:bold;margin:0 0 14px;">── go plan something great ✨ ──</p>
        <p style="font-size:12px;color:#B39AA5;margin:0;">🕒 {{time}}</p>
      </td>
    </tr>
  </table>
  <p style="text-align:center;font-size:12px;color:#C9A9B4;margin:16px 0 0;">🌸 sent from your for-nishi page</p>
</div>
