<!-- EmailJS template #1: "update" (she opened it / she said no)
     Subject in EmailJS:  {{emoji}} {{title}}
     Paste everything below into the template's code editor. -->
<div style="background:#FFF8F1;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;border:1px solid #F1DFE3;">
    <tr>
      <td style="padding:36px 28px;text-align:center;">
        <div style="font-size:56px;line-height:1;">{{emoji}}</div>
        <h1 style="font-size:24px;color:#4A2C3A;margin:18px 0 10px;">{{title}}</h1>
        <p style="font-size:16px;color:#7A5A68;margin:0 0 22px;line-height:1.5;">{{message}}</p>
        <p style="font-size:12px;color:#B39AA5;margin:0;">🕒 {{time}}</p>
      </td>
    </tr>
  </table>
  <p style="text-align:center;font-size:12px;color:#C9A9B4;margin:16px 0 0;">🌸 sent from your for-nishi page</p>
</div>
